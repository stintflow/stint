quarkus.application.name=stint-aws-smoke
quarkus.http.port=8080

# SDD 2.7: every AWS client comes from its Quarkus extension (SQS, DynamoDB, S3, EventBridge, Scheduler) and is
# configured through quarkus.<service>.*. The QuarkusIntegrationTest points them at floci; in production they
# use the default AWS credentials chain. No dev services: the test brings its own floci.
quarkus.sqs.devservices.enabled=false
quarkus.dynamodb.devservices.enabled=false
quarkus.s3.devservices.enabled=false
quarkus.eventbridge.devservices.enabled=false
quarkus.eventbridge-scheduler.devservices.enabled=false
quarkus.sqs.sync-client.type=url
quarkus.dynamodb.sync-client.type=url
quarkus.s3.sync-client.type=url
quarkus.eventbridge.sync-client.type=url
quarkus.eventbridge-scheduler.sync-client.type=url

# The workflow YAMLs must be embedded in the native image (SDD 1.4, sec. 8a).
quarkus.native.resources.includes=stint/workflows/index.txt,stint/workflows/*.yaml

# Where the smoke app's resources live (the test sets them).
smoke.sqs.invoke-queue-url=
smoke.sqs.result-queue-url=
smoke.sqs.timer-queue-url=
smoke.sqs.schedule-queue-url=
smoke.scheduler.role-arn=arn:aws:iam::000000000000:role/stint-scheduler
smoke.scheduler.timer-target-arn=
smoke.scheduler.schedule-target-arn=
smoke.eventbridge.domain-bus=stint-domain
smoke.s3.bucket=stint-smoke
