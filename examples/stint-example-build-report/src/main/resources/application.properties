quarkus.application.name=stint-build-report
quarkus.http.port=8080

# This example runs entirely in-memory (local bundle): no cloud, no floci needed.
# POST http://localhost:8080/reports  with  {"reportQuery":"...","outputFormat":"xlsx"}

# SDD 1.4, sec. 8a: the build-time manifest (stint/workflows/index.txt) plus every YAML it lists
# must be embedded in the native image — native-image cannot list a classpath directory at runtime,
# so DslLoader.loadClasspath reads them by exact name instead. Proven by a disposable native spike.
quarkus.native.resources.includes=stint/workflows/index.txt,stint/workflows/*.yaml
