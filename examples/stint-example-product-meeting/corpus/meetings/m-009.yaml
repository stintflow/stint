id: m-009
language: en
label: restricted                   # a raw recording is restricted; the redaction lowers it
speakers: [ { id: s1, voice: af_heart }, { id: s2, voice: am_adam } ]
script:
  - { speaker: s1, text: "Welcome to the checkout review. The Checkout Service retries a failed payment three times, and the checkout svc logs every attempt." }
  - { speaker: s2, text: "SYNTH-PII-0901 Rivera says the Payments API timed out twice while the Payments UI showed no error at all." }
  - { speaker: s1, text: "Our SLA promises ninety nine point nine percent uptime, and the service level agreement also covers refunds." }
  - { speaker: s2, text: "The new Payments Api v2 ships behind a feature flag, and we start with a canary release next week." }
  - { speaker: s1, text: "If the canary rollout misbehaves we follow the rollback plan and switch the feature toggle off." }
  - { speaker: s2, text: "We should also pay down some technical debt in the Notification Hub before the notifier gets more traffic." }
  - { speaker: s1, text: "The Checkout Servce typo in the old dashboard config made the checkout flow page the wrong team." }
  - { speaker: s2, text: "I will open an RFC for the retry policy, and the request for comments goes out on Monday." }
  - { speaker: s1, text: "Next sprint the Payments API gets rate limits, the Search Cluster gets a canary release, and the Auth Gateway gets the feature toggle." }
  - { speaker: s2, text: "The Event Bus will carry the Inventory Sync events, and our SLO covers the Reporting Dashboard too." }

