id: m-011
language: en
label: restricted                   # a raw recording is restricted; the redaction lowers it
speakers: [ { id: s1, voice: af_bella }, { id: s2, voice: bm_george } ]
script:
  - { speaker: s1, text: "Let's write the runbook for restarting the Search Cluster, and for the search service dashboards." }
  - { speaker: s2, text: "SYNTH-PII-1101 Haddad says the search cluster drains slowly after a certificate rotation." }
  - { speaker: s1, text: "The Certificate Manager renews the certificates, but the cert manager alerts were muted." }
  - { speaker: s2, text: "The Auth Gateway checks them too, and the login gateway restarts when the bundle changes." }
  - { speaker: s1, text: "The Reports Database and the reporting db share the same maintenance window." }
  - { speaker: s2, text: "The Reporting Dashboard reads from the reports database, so tell the dashboard owners." }
  - { speaker: s1, text: "Our SLA for search is lower than the SLA for checkout, which uses the Checkout Service." }
  - { speaker: s2, text: "I will draft the rollback procedure and add the health checks, then ping the Notification Hub owners." }
  - { speaker: s1, text: "After the rotation, check the Event Bus, the Inventory Sync and the stock sync dashboards, then the search service again." }
  - { speaker: s2, text: "The playbook says to page the owners of the Payments API and the payments service when the cert manager complains." }

