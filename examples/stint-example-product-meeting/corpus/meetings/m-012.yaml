id: m-012
language: en
label: restricted                   # a raw recording is restricted; the redaction lowers it
speakers: [ { id: s1, voice: am_adam }, { id: s2, voice: bf_emma } ]
script:
  - { speaker: s1, text: "Sprint recap: the Checkout Service, the Payments API and the Notification Hub all changed this sprint." }
  - { speaker: s2, text: "SYNTH-PII-1201 Mensah thinks the Payments UI copy is confusing, and the payments ui buttons are too small." }
  - { speaker: s1, text: "Please use the canary release for the Auth Gateway and keep the rollback plan handy." }
  - { speaker: s2, text: "The feature flag service should live in the Checkout Service, not in the Search Cluster." }
  - { speaker: s1, text: "We owe the customers a postmortem, and the tech debt in the Inventory Sync will be part of it." }
  - { speaker: s2, text: "The Payments API and the Payments Api v2 will run side by side until the SLA review." }
  - { speaker: s1, text: "I will email the Reporting Dashboard owners about the Event Bus change." }
  - { speaker: s2, text: "The Notifcation Hub typo in the alert rule should be fixed too, and the payments front end label as well." }
  - { speaker: s1, text: "The reports dashboard and the Reports Database are healthy, and the login gateway passed the canary rollout." }
  - { speaker: s2, text: "Please link the decision record and the runbook for the Event Bus, the message bus and the notifier." }

