quarkus.application.name=stint-example-product-meeting
quarkus.banner.enabled=false

# The workflow and the corpus must be embedded in the native image.
quarkus.native.resources.includes=stint/workflows/*.yaml,corpus/manifest.json,corpus/meetings/*.yaml

# The OpenAI-compatible provider (manual run) holds a Random in a static field: initialize it at run time.
quarkus.native.additional-build-args=--initialize-at-run-time=dev.langchain4j.internal.RetryUtils
