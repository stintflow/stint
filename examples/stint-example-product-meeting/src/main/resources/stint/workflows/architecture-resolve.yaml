# SDD 3c.2: the architecture domain asks the product domain what the references it just linked point at. The fact 'references
# linked' (3c.1) carries the pointers; this definition resolves them — a task the ORIGIN answers, by its own policy, through the
# view it publishes — and keeps only the status and a pointer to a blob that expires: what was resolved is never in the state of
# this instance. When the origin does not answer, the author chooses here what happens: 'follow' goes on with a marker saying
# there is no content (the default), 'suspend' lets the failure end the instance for the operators.
document:
  dsl: '1.0.0'
  namespace: examples
  name: architecture-resolve
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label }'
      routes:
        restricted: [resolve-pointers]
        confidential: [resolve-pointers]
        internal: ['*']
    x-stint-knowledge:
      base: architecture
      schema: architecture@1
      glossary: architecture@1
schedule:
  on:
    one:
      with: { type: io.stintflow.knowledge.references-linked.v1 }
do:
  - fact:
      set: '${ .[0].data | {documentId: .documentId, pointers: .pointers, onUnavailable: (.onUnavailable // "follow")} }'
      export: { as: '${ . }' }
  - resolve:
      try:
        - run:
            call: remote
            with:
              task: resolve-pointers
              input: '${ {pointers: $context.pointers, depth: 0} }'
            timeout: { after: { seconds: 30 } }
            export: { as: '${ $context + {resolution: "resolved", viewRef: .viewRef, counts: .counts} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/communication }
        when: '$context.onUnavailable == "follow"'
        then: unavailable
  - report:
      emit:
        event:
          with:
            source: https://architecture-resolve.example
            type: io.stintflow.knowledge.pointers-resolved.v1
            subject: '${ $context.documentId }'
            data: '${ {documentId: $context.documentId, resolution: $context.resolution, viewRef: ($context.viewRef // null), counts: ($context.counts // null)} }'
      then: end
  - unavailable:
      set: '${ $context + {resolution: "unavailable"} }'
      export: { as: '${ . }' }
      then: report
