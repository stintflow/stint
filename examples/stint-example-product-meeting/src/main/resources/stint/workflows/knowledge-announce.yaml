# SDD 3c.1: the product domain announces to the others what a meeting added to its knowledge base. The fact 'document indexed'
# (the ingestion's) starts this definition, which asks the base — through the log of changes, never the content — which nodes the
# document added or changed, and emits ONE fact with their pointers, types and levels. A restricted node is never announced and
# nothing the nodes say (name, summary, property) is in the fact. Nothing to announce, nothing emitted. The types are the ones the
# architecture domain cares about; the extraction of the build (a fake) finds systems, a real one decisions and requirements too.
document:
  dsl: '1.0.0'
  namespace: examples
  name: knowledge-announce
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label }'
      routes:
        restricted: [knowledge-announce]
        confidential: [knowledge-announce]
        internal: ['*']
    x-stint-knowledge:
      base: product-meetings
      schema: meetings@1
      glossary: product@1
schedule:
  on:
    one:
      with: { type: io.stintflow.knowledge.document-indexed.v1 }
do:
  - fact:
      set: '${ .[0].data | {documentId: .documentId} }'
      export: { as: '${ . }' }
  - announce:
      try:
        - run:
            call: remote
            with:
              task: knowledge-announce
              input: '${ {documentId: $context.documentId, types: ["Decision", "Requirement", "System"], scope: {namespace: "examples", base: "product-meetings"}} }'
            timeout: { after: { minutes: 2 } }
            export: { as: '${ $context + {items: .items, upTo: .upTo, withheld: .withheld} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/communication }
        retry:
          delay: { seconds: 15 }
          backoff: { exponential: {} }
          limit:
            attempt: { count: 5 }
  - check:
      switch:
        - nothing: { when: '${ ($context.items | length) == 0 }', then: end }
        - something: { then: published }
  - published:
      emit:
        event:
          with:
            source: https://knowledge-announce.example
            type: io.stintflow.knowledge.nodes-published.v1
            subject: '${ $context.documentId }'
            data: '${ {domain: {namespace: "examples", base: "product-meetings"}, documentId: $context.documentId, upTo: $context.upTo, items: $context.items, label: (if ($context.items | map(.level) | any(. == "confidential")) then "confidential" else "internal" end), schemaVersion: "1"} }'
      then: end
