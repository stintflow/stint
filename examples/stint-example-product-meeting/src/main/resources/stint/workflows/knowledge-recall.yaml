# SDD 3b.4, 4.4: a question asked of the knowledge base, with a decision worker choosing how it is answered. The choice is a
# step like any other (a 'decision' call, SDD 3a.2) and the engine's policy, audit and error table come with it; the default of
# the base is 'auto' (no model: the base itself says whether the question names something it knows), and this shows the way for
# whoever wants a model to decide. Only ids, modes and counts travel in the facts.
document:
  dsl: '1.0.0'
  namespace: examples
  name: knowledge-recall
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label }'
      routes:
        restricted: [route-question, knowledge-retrieve]
        confidential: [route-question, knowledge-retrieve]
        internal: ['*']
    x-stint-knowledge:
      base: product-meetings
      schema: meetings@1
      glossary: product@1
schedule:
  on:
    one:
      with: { type: io.stintflow.examples.question-asked.v1 }
do:
  - fact:
      set: '${ .[0].data | {questionId: .questionId, question: .question} }'
      export: { as: '${ . }' }
  - route:
      call: decision
      with:
        task: route-question
        kind: choice
        input: '${ {question: $context.question} }'
        options:
          - semantic: { description: "The question is about a topic: answer by meaning" }
          - relational: { description: "The question is about how named things relate: follow the graph" }
      export: { as: '${ $context + {mode: .value} }' }
  - recall:
      call: remote
      with:
        task: knowledge-retrieve
        input: '${ {query: $context.question, mode: $context.mode, topK: 10, scope: {namespace: "examples", base: "product-meetings"}} }'
      timeout: { after: { minutes: 2 } }
      export: { as: '${ $context + {answeredMode: .mode, counts: .counts, trimmed: .trimmed} }' }
  - answered:
      emit:
        event:
          with:
            source: https://knowledge-recall.example
            type: io.stintflow.knowledge.question-answered.v1
            subject: '${ $context.questionId }'
            data: '${ {questionId: $context.questionId, asked: $context.mode, mode: $context.answeredMode, counts: $context.counts, trimmed: $context.trimmed} }'
      then: end
