# SDD 3b.5: the base moves to another embedding model. The fact 'embedding changed' (whoever changes the worker's
# configuration emits it) names the model; the worker that serves it recomputes every vector in one atomic step, and the old
# vectors are not consulted again. A worker that serves another model refuses (400): the definition asks, the worker decides.
# Repeating the request, or a base already on the model, answers 'unchanged'. Names of models and counts only.
document:
  dsl: '1.0.0'
  namespace: examples
  name: knowledge-reindex
  version: '1.0.0'
  metadata:
    x-stint-policy:
      sensitivity:
        from: '${ .[0].data.label }'
      routes:
        restricted: [knowledge-reindex]
        confidential: [knowledge-reindex]
        internal: ['*']
    x-stint-knowledge:
      base: product-meetings
      schema: meetings@1
      glossary: product@1
schedule:
  on:
    one:
      with: { type: io.stintflow.knowledge.embedding-changed.v1 }
do:
  - request:
      set: '${ .[0].data | {requestId: .requestId, targetModel: .targetModel} }'
      export: { as: '${ . }' }
  - reindex:
      try:
        - run:
            call: remote
            with:
              task: knowledge-reindex
              input: '${ {requestId: $context.requestId, targetModel: $context.targetModel, scope: {namespace: "examples", base: "product-meetings"}} }'
            timeout: { after: { minutes: 30 } }
            export: { as: '${ $context + {status: .status, from: .from, to: .to, passages: .passages, skipped: .skipped} }' }
      catch:
        errors:
          with: { type: https://serverlessworkflow.io/spec/1.0.0/errors/communication }
        retry:
          delay: { seconds: 30 }
          backoff: { exponential: {} }
          limit:
            attempt: { count: 5 }
  - reindexed:
      emit:
        event:
          with:
            source: https://knowledge-reindex.example
            type: io.stintflow.knowledge.reindexed.v1
            subject: '${ $context.requestId }'
            data: '${ {requestId: $context.requestId, status: $context.status, from: $context.from, to: $context.to, passages: $context.passages, skipped: $context.skipped} }'
      then: end
