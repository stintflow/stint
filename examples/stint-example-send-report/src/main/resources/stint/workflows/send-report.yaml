# CNCF Serverless Workflow definition for the send-report flow (SDD 1.4, CA2/CA3; SDD 2.2, CA8).
# 'schedule' is a valid DSL 1.0 construct not implemented yet (SDD 2.4) — loading this file strictly
# (LoadOptions.STRICT) must fail citing it; loading it permissively (LoadOptions.PERMISSIVE) drops it
# (with a warning). The 'emit' task is supported since SDD 2.2: it publishes 'report-sent' on the
# domain channel after 'sendEmail'.
document:
  dsl: '1.0.0'
  namespace: reports
  name: send-report
  version: '1.0.0'
schedule:
  cron: '0 9 * * MON'
do:
  - sendEmail:
      call: remote
      with:
        task: send-email      # routing key -> CloudEvent subject -> selects the worker
        input:
          to: ${ $context.recipient }
          subject: ${ $context.subject }
          body: ${ $context.body }
      export:
        as: '${ $context + {messageId} }'
      # output: { messageId: "..." } merged into $context

  - reportSent:
      emit:
        event:
          with:
            source: https://stintflow.io/reports/send-report
            type: io.stintflow.reports.report-sent.v1
            data: ${ $context }
